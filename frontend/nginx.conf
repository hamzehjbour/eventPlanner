server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Vue Router (history mode) fallback: unmatched paths serve
        # index.html so client-side routing can take over, instead of
        # nginx returning a 404 for e.g. a direct visit to /events/123.
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is not
    # hashed and must always be revalidated so deploys are picked up.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
